name: Collect job listings
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *' # 07:17 UTC+7. GitHub may delay scheduled runs.
permissions:
  contents: write
concurrency:
  group: job-data-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-production.txt
      - name: Verify application and data safeguards
        env:
          DATABASE_URL: ''
        run: python -m unittest discover -s tests -v
      - name: Collect and check API sources
        run: python collector.py
      - name: Commit snapshots and status
        if: always() && env.DATABASE_URL == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/history.json data/run_status.json
          git diff --cached --quiet || (git commit -m "Update jobs and source health" && git pull --rebase && git push)
