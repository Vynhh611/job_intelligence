name: Discover candidate ATS sources
on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * 1'
permissions:
  contents: write
concurrency:
  group: job-data-writer
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-production.txt
      - run: python source_discovery.py
      - name: Commit local candidates
        if: env.DATABASE_URL == ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source_candidates.json
          git diff --cached --quiet || (git commit -m 'Update pending source candidates' && git pull --rebase && git push)
