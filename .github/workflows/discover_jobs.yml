name: Discover public job links
on:
  workflow_dispatch:
  schedule:
    - cron: '47 0 * * *' # Around 07:47 Vietnam time; GitHub schedules can be delayed.
permissions:
  contents: write
concurrency:
  group: job-data-writer
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install collector dependencies
        run: pip install -r requirements-production.txt
      - name: Build source-linked job index (no full descriptions)
        run: python discovery_collector.py
      - name: Commit discovery snapshot
        if: always() && env.DATABASE_URL == ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/discovered_jobs.json data/discovery_status.json data/discovery_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update source-linked job discovery index'
            git pull --rebase
            git push
          fi
