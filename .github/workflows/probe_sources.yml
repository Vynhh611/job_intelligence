name: Probe candidate job boards
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: pip install requests
      - name: Probe public GET endpoints (counts only, no JD publication)
        run: python probe_sources.py
      - name: Commit report when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source_probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update candidate source connectivity report'
            git push
          fi
